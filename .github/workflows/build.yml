name: Build and Package

on:
  push:
    branches:
      - "*"
    tags:
      - "*"
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Determine build version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_VER="${{ github.ref_name }}"
            echo "arg=/p:Version=${TAG_VER#v}" >> "$GITHUB_OUTPUT"
          else
            echo "arg=" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish ${{ matrix.rid }}
        run: >
          dotnet publish DatasetProcessorDesktop/DatasetProcessorDesktop.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained false
          -o ./publish/${{ matrix.rid }}
          ${{ steps.ver.outputs.arg }}

      - name: Set Linux executable permissions
        if: runner.os == 'Linux'
        run: chmod +x ./publish/${{ matrix.rid }}/DatasetProcessorDesktop

      - name: Upload packaged binaries
        uses: actions/upload-artifact@v4
        with:
          name: DatasetHelpers-${{ matrix.rid }}
          path: ./publish/${{ matrix.rid }}/
          if-no-files-found: error
          retention-days: 30
